[project]
name = "tts3d-studio"
version = "0.1.0"
description = "Gradio-based Qwen3-TTS spatial audio studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "gradio>=6.8.0",
    "librosa>=0.11.0",
    "numpy>=2.4.2",
    "qwen-tts>=0.1.1",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers>=4.57.3",
]

[project.scripts]
tts3d-studio = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
